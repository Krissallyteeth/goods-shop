<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>굿즈샵</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6c5ce7" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="굿즈샵" />
</head>
<body>
  <div class="container">
    <h1 class="page-title">상품</h1>

    <!-- 인기 상품: products.is_popular = true 인 것만. 없으면 섹션 자체를 숨깁니다. -->
    <section id="popular-section" style="display:none;">
      <h2 class="section-title">🔥 인기 상품</h2>
      <div id="popular" class="grid"></div>
    </section>

    <h2 class="section-title">전체 상품</h2>
    <div id="products" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">상품이 없습니다.</div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <script src="app.js"></script>
  <script>
    renderNav("index.html");
    loadProducts();

    async function loadProducts() {
      const box = document.getElementById("products");
      try {
        const { data: products, error } = await sb
          .from("products")
          .select("*")
          .eq("is_active", true)
          .order("created_at");

        if (error) {
          box.innerHTML = `<div class="msg error">상품을 불러오지 못했습니다: ${error.message}</div>`;
          return;
        }
        if (!products.length) {
          document.getElementById("empty").style.display = "block";
          return;
        }

        // 인기 상품(is_popular=true)이 하나라도 있으면 위쪽 섹션을 보여줍니다.
        // (컬럼이 아직 없으면 값이 undefined 라 그냥 섹션이 안 뜹니다.)
        const popular = products.filter((p) => p.is_popular);
        if (popular.length) {
          document.getElementById("popular").innerHTML = popular.map(productCard).join("");
          document.getElementById("popular-section").style.display = "block";
        }

        box.innerHTML = products.map(productCard).join("");
      } catch (e) {
        // 네트워크/서버 장애(예: Supabase 일시정지)로 요청 자체가 실패한 경우 — 백지 대신 안내.
        box.innerHTML = `<div class="msg error">상품을 불러오지 못했습니다. 잠시 후 다시 시도해주세요. (${e.message || "네트워크/서버 오류"})</div>`;
      }
    }

    // 상품 카드 하나를 HTML 로 만듭니다. (인기 상품 · 전체 상품이 같이 씁니다)
    function productCard(p) {
      return `
        <div class="card">
          <img src="${p.image_url}" alt="${escapeHtml(p.name)}" loading="lazy" />
          <div class="body">
            <h3>${escapeHtml(p.name)}</h3>
            <p class="desc">${escapeHtml(p.description || "")}</p>
            <div class="price">${won(p.price)}</div>
            <button class="btn" onclick='buy(${JSON.stringify(p.id)}, ${JSON.stringify(p.name)}, ${p.price})'>바로 구매</button>
            <button class="btn secondary">장바구니 담기</button>
            <button class="btn secondary">취소</button>
          </div>
        </div>`;
    }

    async function buy(productId, productName, price) {
      // 1) 로그인 확인
      const user = await getUser();
      if (!user) {
        alert("구매하려면 먼저 로그인 해주세요.");
        location.href = "login.html";
        return;
      }

      // 2) 고유 주문번호를 만들고 주문(PENDING)을 저장
      const orderId = "order_" + crypto.randomUUID().replace(/-/g, "").slice(0, 20);
      const { error } = await sb.from("orders").insert({
        user_id: user.id,
        product_id: productId,
        amount: price,
        status: "PENDING",
        toss_order_id: orderId,
      });
      if (error) {
        alert("주문 생성에 실패했습니다: " + error.message);
        return;
      }

      // 3) 토스 결제창 호출 (성공/실패 시 아래 URL 로 돌아옵니다)
      const toss = TossPayments(window.TOSS_CLIENT_KEY);
      try {
        await toss.requestPayment("카드", {
          amount: price,
          orderId: orderId,
          orderName: productName,
          successUrl: new URL("success.html", location.href).href,
          failUrl: new URL("fail.html", location.href).href,
          customerEmail: user.email,
        });
      } catch (e) {
        // 사용자가 결제창을 닫은 경우 등 — 조용히 무시
        if (e.code !== "USER_CANCEL") console.error(e);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
  </script>
  <script src="pwa.js"></script>
</body>
</html>
