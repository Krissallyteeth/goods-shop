<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>굿즈 샵</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6c5ce7" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="turingshop" />
</head>
<body>
  <div class="container">
    <h1 class="page-title">상품</h1>
    <div id="products" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">상품이 없습니다.</div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <script src="app.js"></script>
  <script>
    renderNav("index.html");
    loadProducts();

    async function loadProducts() {
      const { data: products, error } = await sb
        .from("products")
        .select("*")
        .eq("is_active", true)
        .order("created_at");

      const box = document.getElementById("products");
      if (error) {
        box.innerHTML = `<div class="msg error">상품을 불러오지 못했습니다: ${error.message}</div>`;
        return;
      }
      if (!products.length) {
        document.getElementById("empty").style.display = "block";
        return;
      }

      box.innerHTML = products
        .map(
          (p) => `
          <div class="card">
            <img src="${p.image_url}" alt="${escapeHtml(p.name)}" loading="lazy" />
            <div class="body">
              <h3>${escapeHtml(p.name)}</h3>
              <p class="desc">${escapeHtml(p.description || "")}</p>
              <div class="price">${won(p.price)}</div>
              <button class="btn" onclick='buy(${JSON.stringify(p.id)}, ${JSON.stringify(p.name)}, ${p.price})'>구매하기</button>
            </div>
          </div>`
        )
        .join("");
    }

    async function buy(productId, productName, price) {
      // 1) 로그인 확인
      const user = await getUser();
      if (!user) {
        alert("구매하려면 먼저 로그인 해주세요.");
        location.href = "login.html";
        return;
      }

      // 2) 고유 주문번호를 만들고 주문(PENDING)을 저장
      const orderId = "order_" + crypto.randomUUID().replace(/-/g, "").slice(0, 20);
      const { error } = await sb.from("orders").insert({
        user_id: user.id,
        product_id: productId,
        amount: price,
        status: "PENDING",
        toss_order_id: orderId,
      });
      if (error) {
        alert("주문 생성에 실패했습니다: " + error.message);
        return;
      }

      // 3) 토스 결제창 호출 (성공/실패 시 아래 URL 로 돌아옵니다)
      const toss = TossPayments(window.TOSS_CLIENT_KEY);
      try {
        await toss.requestPayment("카드", {
          amount: price,
          orderId: orderId,
          orderName: productName,
          successUrl: new URL("success.html", location.href).href,
          failUrl: new URL("fail.html", location.href).href,
          customerEmail: user.email,
        });
      } catch (e) {
        // 사용자가 결제창을 닫은 경우 등 — 조용히 무시
        if (e.code !== "USER_CANCEL") console.error(e);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
  </script>
  <script src="pwa.js"></script>
</body>
</html>
