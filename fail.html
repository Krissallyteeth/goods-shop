<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>결제 실패 · 굿즈샵</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6c5ce7" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="굿즈샵" />
</head>
<body>
  <div class="container">
    <div class="center-box">
      <div class="icon">❌</div>
      <h1>결제가 취소되었어요</h1>
      <p id="reason">결제가 완료되지 않았습니다.</p>
      <a class="btn" href="index.html">상품으로 돌아가기</a>
    </div>
  </div>

  <script>
    // 토스가 전달한 실패 사유를 보여줍니다.
    const q = new URLSearchParams(location.search);
    const message = q.get("message");
    if (message) document.getElementById("reason").textContent = message;
  </script>
  <script src="pwa.js"></script>
</body>
</html>
